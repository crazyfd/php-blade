name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        stability: ['lowest', 'highest']

    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer validate --strict
          if [ "${{ matrix.stability }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable -W
          else
            composer update -W
          fi

      - name: Run tests
        run: composer test
